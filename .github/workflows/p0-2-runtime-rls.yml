name: P0.2 Runtime RLS

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-2-runtime-rls:
    name: P0.2 runtime RLS behavioral gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.NEXORA_RUNTIME_TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Require runtime database secret
        run: test -n "$DATABASE_URL"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify runtime role without exposing credentials
        run: |
          set -euo pipefail
          result="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select current_user || '|' || rolsuper || '|' || rolbypassrls from pg_roles where rolname=current_user")"
          test "$result" = 'nexora_runtime_test|f|f'

      - name: Run behavioral PostgreSQL/RLS gate
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/p0_2_runtime_rls.sql
