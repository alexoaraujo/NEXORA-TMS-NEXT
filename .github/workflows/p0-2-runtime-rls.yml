name: P0.2 Runtime RLS

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-rls:
    name: p0-2-runtime-rls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      P0_2_DATABASE_URL: ${{ secrets.NEXORA_RUNTIME_TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require runtime database secret
        shell: bash
        run: |
          test -n "$P0_2_DATABASE_URL" || { echo 'Missing GitHub secret NEXORA_RUNTIME_TEST_DATABASE_URL'; exit 1; }
      - name: Verify runtime role without exposing credentials
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          test "$(psql "$P0_2_DATABASE_URL" -Atqc 'select current_user')" = 'nexora_runtime_test'
          test "$(psql "$P0_2_DATABASE_URL" -Atqc 'select rolsuper from pg_roles where rolname=current_user')" = 'f'
          test "$(psql "$P0_2_DATABASE_URL" -Atqc 'select rolbypassrls from pg_roles where rolname=current_user')" = 'f'
      - name: Run behavioral RLS suite
        env:
          PGCONNECT_TIMEOUT: 10
        run: psql "$P0_2_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/p0_2_runtime_rls.sql
      - name: Verify no secret material is committed
        run: |
          ! grep -RInE '(postgres(ql)?://[^[:space:]]+:[^[:space:]]+@|BEGIN (RSA|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
