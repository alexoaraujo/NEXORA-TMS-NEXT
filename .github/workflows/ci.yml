name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: write

jobs:
  prepare-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Generate real lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Validate frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit generated lockfile when needed
        if: github.event_name == 'push' && github.ref_name != 'main'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: generate pnpm lockfile'
          git push origin HEAD:${{ github.ref_name }}

  quality:
    needs: prepare-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  sql-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify migration files exist
        run: |
          test -s database/migrations/0001_foundation.sql
          test -s database/migrations/0002_tenant_rls.sql
          test -s database/migrations/0003_p0_1_1_application_role.sql
      - name: Verify RLS hardening invariants
        run: |
          grep -q 'NOBYPASSRLS' database/migrations/0003_p0_1_1_application_role.sql
          grep -q 'NOSUPERUSER' database/migrations/0003_p0_1_1_application_role.sql
          grep -q 'FORCE ROW LEVEL SECURITY' database/migrations/0003_p0_1_1_application_role.sql
          grep -q 'tenant context' database/tests/p0_1_1_rls_hardening.sql
      - name: Reject accidental secret material
        run: '! grep -RInE "(BEGIN (RSA|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@)" --exclude-dir=.git .'
